# Install as nginx/dev-conf.d/ministry-website.conf in kingship-shared-services.
server {
    listen 80;
    server_name ministry.localhost;
    server_tokens off;
    client_max_body_size 12M;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $ministry_upstream ministry-website-dev:80;
        proxy_pass http://$ministry_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 65s;
        proxy_redirect off;
    }
}
