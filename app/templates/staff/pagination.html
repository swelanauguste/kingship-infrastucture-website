{% if page_obj.has_other_pages %}<nav class="staff-pagination" aria-label="Page navigation">{% if page_obj.has_previous %}<a class="button outline" href="?q={{ query|urlencode }}&category={{ category|urlencode }}&status={{ status|urlencode }}&page={{ page_obj.previous_page_number }}">Previous</a>{% endif %}<span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="button outline" href="?q={{ query|urlencode }}&category={{ category|urlencode }}&status={{ status|urlencode }}&page={{ page_obj.next_page_number }}">Next</a>{% endif %}</nav>{% endif %}
